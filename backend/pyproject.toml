[project]
name = "maxxx-backend"
version = "0.1.0"
description = "Evidence-backed research and publishing backend"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "httpx>=0.28,<1",
  "psycopg[binary,pool]>=3.2,<4", "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4", "trafilatura>=2,<3",
  "feedparser>=6,<7", "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
maxxx-api = "app.core.runtime:api_main"
maxxx-index = "app.retrieval.index:main"
maxxx-worker = "app.workers.runner:main"
maxxx-setup = "app.database.setup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]
